name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate agent and skill frontmatter
        run: bash scripts/agent-lint.sh

      - name: Orphan skill scan
        run: bash scripts/orphan-skill-scan.sh

      - name: Size limits check
        run: bash scripts/size-limits.sh --warn-only

      - name: Shellcheck scripts
        run: find scripts -name '*.sh' -exec shellcheck {} +

      - name: README sync check
        run: |
          # Allow up to 5% line-count difference; larger gaps suggest one file wasn't updated
          check_pair() {
            local en="$1" ptbr="$2"
            EN_LINES=$(wc -l < "$en")
            PTBR_LINES=$(wc -l < "$ptbr")
            DIFF=$(( EN_LINES - PTBR_LINES ))
            DIFF=${DIFF#-}
            THRESHOLD=$(( EN_LINES * 5 / 100 + 1 ))
            if [ "$DIFF" -gt "$THRESHOLD" ]; then
              echo "$en ($EN_LINES lines) and $ptbr ($PTBR_LINES lines) differ by $DIFF lines (threshold: $THRESHOLD)."
              echo "Update $ptbr to match $en changes."
              return 1
            fi
            echo "Sync OK: $en ↔ $ptbr (diff: $DIFF lines)"
          }
          FAIL=0
          check_pair README.md README.pt-BR.md || FAIL=1
          check_pair docs/agents.md docs/agents.pt-BR.md || FAIL=1
          check_pair docs/installation.md docs/installation.pt-BR.md || FAIL=1
          exit $FAIL
