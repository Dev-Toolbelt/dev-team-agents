name: CI

# Trigger policy
# --------------
# `push` is scoped to the default branch and to tags; branch validation happens
# on `pull_request`. Previously both triggers matched "**", so every push to a
# branch with an open PR ran the whole workflow twice. Concurrency alone cannot
# dedupe that: a branch push and its PR event carry different `github.ref`
# values (refs/heads/x vs refs/pull/N/merge) and therefore land in different
# concurrency groups. Narrowing the push trigger is what actually removes the
# duplicate run; the concurrency block below then cancels superseded runs.
#
# Trade-off: a branch with no open PR no longer gets CI on push. Open a draft PR
# to get feedback before the branch is ready for review.
on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    branches: ["**"]

# One in-flight run per PR (or per pushed ref). A new commit cancels the run it
# supersedes. Tag runs are never cancelled — a release validation should always
# finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # Validates the name of the tag being pushed, and only that tag: the job runs
  # on the `push` tag event, so `github.ref` is always the ref just created. It
  # never enumerates existing tags, which is why the two already-published
  # malformed tags (v.1.1.0, v.1.3.13) cannot retroactively fail CI — they are
  # not re-pushed, so this job never sees them.
  tag-name:
    name: Tag name convention
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}

    steps:
      - name: Validate pushed tag matches vX.Y.Z
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Pushed tag: $TAG"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag name '$TAG'."
            echo "Tags must match ^v[0-9]+\.[0-9]+\.[0-9]+$ (e.g. v1.4.0) per CLAUDE-md/versioning.md."
            echo "Common mistake: a dot after the 'v' (v.1.4.0) — as in the published v.1.1.0 and v.1.3.13."
            echo "Delete the bad tag and re-push a correct one:"
            echo "  git tag -d $TAG && git push origin :refs/tags/$TAG"
            exit 1
          fi
          echo "Tag name OK ✓"

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The runner image ships its own shellcheck and bumps it without telling anyone.
      # That made this gate's verdict depend on the image: 0.9.0 on the runner against
      # 0.11.0 on a contributor's machine, which disagree about an SC2317 false positive,
      # produced a clean local run and a red CI on the same commit. Version and hashes
      # live in .github/shellcheck.pin so this step and 01-lint.sh cannot drift apart.
      #
      # The hash is verified before the binary is used. This repository already refuses
      # to run an unverified download in scripts/lib/installer-fetch.sh; a CI step that
      # executed whatever the network returned would contradict that for no reason.
      - name: Install the pinned shellcheck
        run: |
          set -euo pipefail
          PIN=.github/shellcheck.pin
          VERSION="$(sed -n 's/^version=//p' "$PIN")"
          ARCH="$(uname -m)"
          EXPECTED="$(sed -n "s/^sha256_${ARCH}=//p" "$PIN")"
          if [ -z "$VERSION" ] || [ -z "$EXPECTED" ]; then
            echo "::error::$PIN has no version, or no sha256 for arch '$ARCH'"
            exit 1
          fi
          URL="https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/shellcheck-v${VERSION}.linux.${ARCH}.tar.xz"
          echo "pinned shellcheck $VERSION ($ARCH)"
          curl -fsSL --retry 3 --retry-delay 2 -o shellcheck.tar.xz "$URL"
          echo "${EXPECTED}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz "shellcheck-v${VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-v${VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-v${VERSION}"
          # Prove the thing now on PATH is the thing we pinned — `install` to
          # /usr/local/bin only wins if it precedes the image's copy.
          INSTALLED="$(shellcheck --version | sed -n 's/^version: //p')"
          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "::error::shellcheck on PATH is $INSTALLED, expected $VERSION (which shellcheck: $(command -v shellcheck))"
            exit 1
          fi

      - name: Lint, orphan scan, fingerprint uniqueness, size limits, shellcheck
        run: bash .github/scripts/ci/01-lint.sh

      - name: README / docs sync check (EN ↔ pt-BR)
        run: bash .github/scripts/ci/02-readme-sync.sh

  # This is the highest-value cross-OS addition in the workflow: the CLI (`scripts/lib/devteam/`)
  # is the part of the repository that most directly claims Windows and macOS support — bind's
  # `copy` mode exists solely for a Windows host without symlink privilege, and `core/current` is
  # plain text rather than a symlink for the same reason — yet until now every assertion about
  # that code ran on Linux only. `python3 -m unittest` is portable stdlib, so there is no reason
  # not to run it for real on the platforms the CLI is shipped for.
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `os: [ubuntu-latest]` cross-joined with both python versions keeps the floor check
        # (see below) cheap, then `include` adds one representative run per extra OS at the
        # newest interpreter only — a full 3-OS × 2-python cross product would burn CI minutes
        # proving the same interpreter floor a second and third time, which the version matrix
        # below already covers on Linux.
        os: [ubuntu-latest]
        # The floor is tested explicitly. Testing only the newest interpreter hid
        # a real defect once already: tarfile's extraction filter defaults to
        # `data` from 3.14 on, which masked an unsafe-member bug on every version
        # a user is actually likely to run.
        python: ["3.9", "3.x"]
        include:
          - os: windows-latest
            python: "3.x"
          - os: macos-latest
            python: "3.x"
    steps:
      - uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # `shell: bash` is explicit rather than assumed: it is the runner default on ubuntu/macos,
      # but the default on windows-latest is PowerShell. GitHub ships git-bash on every Windows
      # runner for exactly this, so the script itself needs no rewrite.
      - name: Byte-compile and run the unit tests
        shell: bash
        run: bash .github/scripts/ci/03-python.sh

  # The first JavaScript gate in a repository ADR-0009 holds at python3 and bash.
  # ADR-0015 puts an Electron desktop client under `app/` (TypeScript + Vite +
  # React, shadcn/ui and Tailwind in the renderer) and its Risks table names the
  # hole this job closes: "An Electron dependency tree lands in a repository with
  # no JavaScript gate." Nothing here read a package.json before.
  #
  # WHAT IT COVERS — a reproducible install from the committed lockfile
  # (`npm ci`), then the three headless npm scripts that are the app's CI
  # contract: typecheck, lint, test. The unit-test step additionally asserts the
  # suite was not vacuous (a runner whose glob matches nothing exits 0). Nothing
  # that needs a display or produces an installer is invoked — `start`,
  # `dev:app`, `dev:renderer` and `dist:mac` are never called by CI.
  #
  # WHEN IT RUNS — this job inherits the workflow trigger above and adds nothing,
  # so it is NOT "every push": every pull request, plus pushes to `main` and to
  # tags. An app change on a branch with no open PR is unchecked until the PR
  # exists; the trigger policy at the top of this file states that trade-off and
  # how to opt in (open a draft PR).
  #
  # There is deliberately no `paths:` filter on `app/**`. The app is a client of
  # the CLI's `--json` output, which ADR-0011 makes public API — filtering would
  # mean a change under `scripts/lib/devteam/` never exercises the only consumer
  # of that output in the repository, which is the side of the contract most
  # likely to break unnoticed. The job runs concurrently with the others and
  # setup-node caches on app/package-lock.json, so the filter would save minutes
  # the wall clock never sees.
  # ADR-0015's desktop client claims Windows and macOS as install targets the same as the CLI
  # does, so `npm ci`/typecheck/lint/test now run on all three instead of proving only the Linux
  # leg of a cross-platform Electron app. One node version (from app/.nvmrc) per extra OS — the
  # node pin itself is not an OS-sensitive fact, so there is nothing a second version would catch
  # that this job's `check_node_pin` step does not already assert on Linux.
  app:
    name: Desktop app (TypeScript / Electron client, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # 05-app.sh is bash written against `set -euo pipefail`, mktemp, sed and find — all present
    # via the git-bash GitHub ships on windows-latest. A job-level default keeps every `run:`
    # step below on that shell without repeating `shell: bash` on each one; `windows-latest`'s
    # own PowerShell default is what this overrides.
    defaults:
      run:
        shell: bash

    steps:
      # persist-credentials: false because this is the one job that runs third-party
      # code — `npm ci` over 641 locked packages, on a `pull_request` event a fork can
      # trigger. The workflow-level `contents: read` already means the token cannot
      # write, and no secret is referenced here, so this removes the token from the
      # runner's git config rather than fixing an exploit. Nothing in this job pushes
      # or fetches again, so it costs nothing.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Before setup-node, and with no node required: this reports a missing
      # app/, lockfile or version pin in the gate's own words rather than as the
      # action's "Unable to find .nvmrc". A missing tree fails the job — the gate
      # has no skip path, for the reason stated in 05-app.sh's preflight comment.
      - name: Preflight — app tree, lockfile and node pin
        run: bash .github/scripts/ci/05-app.sh --preflight

      # The version comes from app/.nvmrc and from nowhere else, so `nvm use` in a
      # contributor's shell and this job resolve the same interpreter. Mirrors how
      # the lint job treats .github/shellcheck.pin: one file holds the number, and
      # 05-app.sh then proves the interpreter on PATH is the pinned one instead of
      # assuming the action honoured it.
      - name: Set up node from app/.nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci, typecheck, lint, unit tests
        run: bash .github/scripts/ci/05-app.sh

  provider-contracts:
    name: Provider contract (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, opencode, codex]

    steps:
      - uses: actions/checkout@v4

      - name: Set up python3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Render ${{ matrix.provider }} into staging
        run: |
          mkdir -p /tmp/staging
          bash .github/scripts/ci/provider/10-render.sh \
            "${{ matrix.provider }}" "$GITHUB_WORKSPACE" /tmp/staging

      - name: Attendance — counts derived from canonical source
        run: |
          bash .github/scripts/ci/provider/20-attendance.sh \
            "${{ matrix.provider }}" "$GITHUB_WORKSPACE" /tmp/staging

      - name: Schema + cross-ref contract
        run: |
          bash .github/scripts/ci/provider/30-contract.sh \
            "${{ matrix.provider }}" "$GITHUB_WORKSPACE" /tmp/staging

      - name: Install into fixture project
        run: |
          mkdir -p /tmp/fixture
          bash .github/scripts/ci/provider/40-install-fixture.sh \
            "${{ matrix.provider }}" "$GITHUB_WORKSPACE" /tmp/fixture

      - name: Validate installed fixture parses and carries artifacts
        run: |
          bash .github/scripts/ci/provider/50-validate-installed.sh \
            "${{ matrix.provider }}" "$GITHUB_WORKSPACE" /tmp/fixture

  slim-bootstrap:
    name: Slim install + provider bootstrap
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up python3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Slim tarball strip rules + opencode/codex bootstrap via install-provider.sh
        run: |
          mkdir -p /tmp/slim-fixture
          bash .github/scripts/ci/slim-bootstrap.sh "$GITHUB_WORKSPACE" /tmp/slim-fixture

  # `packaging/` had no gate in CI at all before this job. Nothing in the workflow
  # or in .github/scripts/ci/ so much as read the directory, so a Homebrew formula
  # could stop being valid ruby, or the three winget manifests could disagree with
  # each other about the version, and the build would still go green. The only
  # verification was packaging/README.md's "Verification" section — three commands
  # a human is asked to run by hand, which is to say: run by nobody.
  #
  # The version bump that directory documents lands in FOUR places by hand
  # (PackageVersion in all three manifests, plus the name of the version directory
  # they live in). Three of the gate's checks exist for that one edit.
  #
  # WHEN THIS RUNS — this job inherits the workflow trigger above and nothing
  # more, so it is NOT "every push": every pull request, plus pushes to `main` and
  # to tags. A packaging change sitting on a branch with no open PR is unchecked
  # until the PR exists (the trigger policy at the top states that trade-off and
  # how to opt in: open a draft PR). The same accurate statement is in
  # 04-packaging.sh's Homebrew section, where an earlier "on every push" claim was
  # simply false.
  packaging:
    name: Packaging manifests (Homebrew + winget)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up python3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Installed explicitly, mirroring the "Set up jq" step in provider-contracts,
      # rather than relying on whatever ruby the runner image happens to preinstall.
      # Unlike shellcheck (see .github/shellcheck.pin) the version is not pinned:
      # `ruby -c` is a parser invocation with a yes/no verdict, not a linter that
      # grows new findings between releases, so image drift cannot flip this gate
      # the way a shellcheck bump did.
      - name: Set up ruby
        run: sudo apt-get update -y && sudo apt-get install -y ruby

      - name: Homebrew formula syntax + winget manifest contract
        run: bash .github/scripts/ci/04-packaging.sh
