name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate agent and skill frontmatter
        run: bash scripts/agent-lint.sh

      - name: Orphan skill scan
        run: bash scripts/orphan-skill-scan.sh

      - name: Size limits check
        run: bash scripts/size-limits.sh --warn-only

      - name: Shellcheck scripts
        run: find scripts -name '*.sh' -exec shellcheck {} +

      - name: README sync check
        run: |
          # Check that all ## sections in the EN file are present in the pt-BR translation.
          # Also apply a loose 50% line-count sanity check to catch wholesale missing content.
          check_pair() {
            local en="$1" ptbr="$2"
            local fail=0

            # Section-count match (primary check)
            # Headers are translated so we compare counts, not text.
            # A mismatch means a section was added in one file but not the other.
            en_count=$(grep -c "^## " "$en" 2>/dev/null || echo 0)
            ptbr_count=$(grep -c "^## " "$ptbr" 2>/dev/null || echo 0)
            if [ "$en_count" != "$ptbr_count" ]; then
              echo "Section mismatch: $en ↔ $ptbr ($en_count vs $ptbr_count sections)"
              fail=1
            fi

            # Loose line-count sanity (50% threshold — catches missing large blocks)
            EN_LINES=$(wc -l < "$en")
            PTBR_LINES=$(wc -l < "$ptbr")
            DIFF=$(( EN_LINES - PTBR_LINES ))
            DIFF=${DIFF#-}
            THRESHOLD=$(( EN_LINES / 2 + 1 ))
            if [ "$DIFF" -gt "$THRESHOLD" ]; then
              echo "$en and $ptbr differ by $DIFF lines (>50%). Check for missing content."
              fail=1
            fi

            [ "$fail" -eq 0 ] && echo "Sync OK: $en ↔ $ptbr"
            return $fail
          }
          FAIL=0
          check_pair README.md README.pt-BR.md || FAIL=1
          check_pair docs/agents.md docs/agents.pt-BR.md || FAIL=1
          check_pair docs/installation.md docs/installation.pt-BR.md || FAIL=1
          exit $FAIL
