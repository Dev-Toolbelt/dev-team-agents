name: Windows CLI installers

# The Windows CLI installers (ADR-0028), in one place for three callers:
#   - release.yml calls it on a vX.Y.Z tag and attaches the installers to the release;
#   - a pull request that touches what the installers ship builds and smoke-tests them,
#     so a broken installer shows up before a tag, not after one;
#   - workflow_dispatch rebuilds them for an existing tag, attaching only when asked.
# Built on Windows from the ref's own tree, installed silently on this runner as a
# smoke test, uninstalled, then (attach only) uploaded with their SHA256SUMS.txt — the
# asset names the app's "Install the CLI" action and the winget manifest look for. What
# this does NOT cover: the interactive wizard and its Git for Windows prompt, which a
# silent install skips.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) the installers are built from"
        required: true
        type: string
      attach:
        description: "Attach the installers to the tag's GitHub release"
        required: true
        type: boolean
    secrets:
      WIN_ESIGNER_USERNAME:
        required: false
      WIN_ESIGNER_PASSWORD:
        required: false
      WIN_ESIGNER_CREDENTIAL_ID:
        required: false
      WIN_ESIGNER_TOTP_SECRET:
        required: false
  pull_request:
    paths:
      - "packaging/windows-cli/**"
      - "scripts/cli/**"
      - "scripts/lib/devteam/**"
      - ".github/workflows/windows-cli.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string
      attach:
        description: "Attach the installers to that tag's GitHub release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build code (build.py, the NSIS script, the installer) runs with a read-only token;
  # only the attach job below, which runs no build code, can write to a release.
  windows-cli-installer:
    name: Build and smoke-test the Windows CLI installers
    runs-on: windows-latest
    # ADR-0055: a build whose installers will be attached is the one that signs, and it runs in
    # the environment that holds the production eSigner secrets; every other run uses none.
    environment: ${{ (inputs.attach && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) && 'esigner-production' || '' }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    env:
      INPUT_TAG: ${{ inputs.tag }}
      ATTACH: ${{ inputs.attach && 'true' || 'false' }}
    steps:
      # A pull request builds its own head at the version CHANGELOG.md names; a tag
      # build uses the tag, which must be vX.Y.Z (NSIS's VIProductVersion takes numbers only).
      - name: Resolve the ref and the version
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag '$INPUT_TAG' does not match ^v[0-9]+\.[0-9]+\.[0-9]+$ — refusing to build installers."
              exit 1
            fi
            echo "CHECKOUT_REF=refs/tags/$INPUT_TAG" >> "$GITHUB_ENV"
            echo "TAG=$INPUT_TAG" >> "$GITHUB_ENV"
            echo "VERSION=${INPUT_TAG#v}" >> "$GITHUB_ENV"
          else
            echo "CHECKOUT_REF=" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # A pinned version, not whatever Chocolatey serves today: this job builds the
      # executable users run. build.py finds makensis under Program Files itself, so
      # nothing is written to GITHUB_PATH (a POSIX path there is not one Windows
      # python can resolve).
      - name: Install NSIS
        run: |
          set -euo pipefail
          choco install nsis --version 3.13.0 -y --no-progress

      - name: Build the installers
        run: |
          set -euo pipefail
          if [ -n "${VERSION:-}" ]; then
            python packaging/windows-cli/build.py --version "$VERSION" --out dist
          else
            python packaging/windows-cli/build.py --out dist
            installer="$(ls dist/devteam-setup-*-x64.exe)"
            version="${installer#dist/devteam-setup-}"
            echo "VERSION=${version%-x64.exe}" >> "$GITHUB_ENV"
          fi

      # ADR-0055: only a build whose installers will be attached signs (the attach job's own rule:
      # a release call, or a dispatch from main). A pull request or a rebuild that attaches nothing
      # never signs, since each signature is billed, and never sees the secrets. Signing rewrites
      # the files, so SHA256SUMS.txt is written again from the signed installers.
      - name: Detect the eSigner credentials
        id: esigner
        if: ${{ inputs.attach && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        env:
          WIN_ESIGNER_USERNAME: ${{ secrets.WIN_ESIGNER_USERNAME }}
          WIN_ESIGNER_PASSWORD: ${{ secrets.WIN_ESIGNER_PASSWORD }}
          WIN_ESIGNER_CREDENTIAL_ID: ${{ secrets.WIN_ESIGNER_CREDENTIAL_ID }}
          WIN_ESIGNER_TOTP_SECRET: ${{ secrets.WIN_ESIGNER_TOTP_SECRET }}
        run: |
          set -euo pipefail
          count=0
          for name in WIN_ESIGNER_USERNAME WIN_ESIGNER_PASSWORD WIN_ESIGNER_CREDENTIAL_ID WIN_ESIGNER_TOTP_SECRET; do
            [ -n "${!name:-}" ] && count=$((count + 1))
          done
          # A rebuild of a tag older than ADR-0055 has no signing scripts in its tree.
          if [ ! -f app/build/sign-windows.cjs ] || [ ! -f .github/scripts/release/install-codesigntool.sh ]; then
            echo "::warning::This tree predates eSigner signing (ADR-0055): the installers stay unsigned."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [ "$count" -eq 4 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "$count" -gt 0 ]; then
            echo "::error::Only $count of the 4 WIN_ESIGNER_* secrets are set. Set all four, or remove them for an unsigned build."
            exit 1
          else
            echo "::notice::No WIN_ESIGNER_* secrets: the installers are built unsigned."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install CodeSignTool (production eSigner)
        if: ${{ steps.esigner.outputs.sign == 'true' }}
        run: bash .github/scripts/release/install-codesigntool.sh PROD

      - name: Sign the installers
        if: ${{ steps.esigner.outputs.sign == 'true' }}
        env:
          WIN_ESIGNER_USERNAME: ${{ secrets.WIN_ESIGNER_USERNAME }}
          WIN_ESIGNER_PASSWORD: ${{ secrets.WIN_ESIGNER_PASSWORD }}
          WIN_ESIGNER_CREDENTIAL_ID: ${{ secrets.WIN_ESIGNER_CREDENTIAL_ID }}
          WIN_ESIGNER_TOTP_SECRET: ${{ secrets.WIN_ESIGNER_TOTP_SECRET }}
        run: |
          set -euo pipefail
          node app/build/sign-windows.cjs "dist/devteam-setup-$VERSION-x64.exe" "dist/devteam-setup-$VERSION-arm64.exe"
          # The same two installers and line format build.py writes (build.py's SHA256SUMS.txt);
          # Git Bash's sha256sum may mark binary mode with '*'. Change both together.
          python - "$VERSION" <<'PY'
          import hashlib, pathlib, sys
          dist = pathlib.Path("dist")
          names = ["devteam-setup-{}-{}.exe".format(sys.argv[1], arch) for arch in ("x64", "arm64")]
          sums = "".join("{}  {}\n".format(hashlib.sha256((dist / n).read_bytes()).hexdigest(), n) for n in names)
          (dist / "SHA256SUMS.txt").write_text(sums, encoding="utf-8")
          PY

      - name: Verify the Authenticode signature of both installers
        if: ${{ steps.esigner.outputs.sign == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in 'x64', 'arm64') {
            $path = "dist\devteam-setup-$env:VERSION-$arch.exe"
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            Write-Host "$path : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "$path has no valid Authenticode signature after signing" }
          }

      - name: Smoke-test a silent install of the x64 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVTEAM_HOME = Join-Path $env:RUNNER_TEMP 'devteam-home'
          $installer = Start-Process -FilePath "dist\devteam-setup-$env:VERSION-x64.exe" -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            # A silent install keeps no log. The files are already in place when setup
            # fails, so run the failing step again where its output is visible.
            $instdir = Join-Path $env:LOCALAPPDATA 'Programs\devteam'
            $python = Join-Path $instdir 'python\python.exe'
            if (Test-Path $python) {
              Write-Host '--- postinstall.py install, re-run for its output ---'
              & $python (Join-Path $instdir 'postinstall.py') install --instdir $instdir 2>&1 | Out-Host
              Write-Host '--- devteam store install --from payload ---'
              & $python (Join-Path $instdir 'cli\scripts\cli\devteam') store install --from (Join-Path $instdir 'payload') 2>&1 | Out-Host
            } else {
              Write-Host "$python was not written"
            }
            throw "installer exited with $($installer.ExitCode)"
          }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\devteam\bin\devteam.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not written" }
          & $exe version --json
          if ($LASTEXITCODE -ne 0) { throw "devteam version exited with $LASTEXITCODE" }
          $listed = & $exe store list --json | ConvertFrom-Json
          if ($listed.current -ne $env:VERSION) {
            throw "the bundled framework $env:VERSION is not the store's current version"
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike '*Programs\devteam\bin*') { throw 'bin was not added to the user PATH' }
          Start-Process -FilePath (Join-Path $env:LOCALAPPDATA 'Programs\devteam\uninstall.exe') -ArgumentList '/S' -Wait | Out-Null
          # The NSIS uninstaller re-launches itself from %TEMP% and returns early: poll.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $gone = ($userPath -notlike '*Programs\devteam\bin*') -and -not (Test-Path $exe)
          } until ($gone -or (Get-Date) -gt $deadline)
          if (-not $gone) { throw 'uninstall left bin on the user PATH, or devteam.exe on disk' }
          if (-not (Test-Path (Join-Path $env:DEVTEAM_HOME 'core'))) { throw 'uninstall removed the store, which it must never touch' }

      - name: Record the tag and version
        id: version
        run: |
          echo "tag=${TAG:-}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Keep the installers for the attach job
        if: ${{ env.ATTACH == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-cli-installers
          path: |
            dist/devteam-setup-*-x64.exe
            dist/devteam-setup-*-arm64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  # A dispatch runs the workflow file of the ref it was started from, so attaching
  # from one is allowed only on main: a branch cannot rewrite a release's assets.
  attach:
    name: Attach the Windows CLI installers to the release
    needs: windows-cli-installer
    if: ${{ inputs.attach && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.windows-cli-installer.outputs.tag }}
      VERSION: ${{ needs.windows-cli-installer.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-cli-installers
          path: dist

      # Draft first, publish after the assets are in: with the repository's immutable
      # releases setting on (ADR-0027 requires it), a published release accepts no new
      # assets. A release that already exists as a draft is reused; one that is already
      # published (a re-run) only takes the upload if the setting allows it.
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md). Windows: devteam-setup-${VERSION}-<arch>.exe installs the devteam CLI with its own Python (ADR-0028); check it against SHA256SUMS.txt."
          fi
          gh release upload "$TAG" \
            "dist/devteam-setup-${VERSION}-x64.exe" \
            "dist/devteam-setup-${VERSION}-arm64.exe" \
            dist/SHA256SUMS.txt \
            --clobber
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
