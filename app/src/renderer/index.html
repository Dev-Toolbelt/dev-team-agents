<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      A CSP in the document as well as in the response header (`main/security.ts`). The
      header is the enforcement; this tag is the one a reviewer reading the markup sees,
      and it is what protects the dev server, whose responses this app does not filter.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dev-team-agents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
