# electron-builder configuration.
#
# SIGNING IS DRIVEN BY THE ENVIRONMENT, AND OFF BY DEFAULT (ADR-0027, ADR-0011).
# Nothing in this file names a certificate or an Apple identity, and no secret ever lives
# here. electron-builder signs and notarises only when it finds credentials, so the same
# file produces:
#
#   - no credentials (every local build, and CI without the secrets): UNSIGNED, exactly as
#     before — an ad-hoc signature on the arm64 half of the universal dmg and nothing else,
#     and `afterAllArtifactBuild` prints the UNSIGNED banner;
#   - credentials present: a signed and, on macOS with the Apple credentials, notarised
#     build, which `build/after-build.cjs` then INSPECTS (codesign, stapler,
#     Get-AuthenticodeSignature) and only then reports as signed. Credentials that did not
#     yield a verifiably signed artifact fail the build instead of shipping quietly.
#
# macOS  CSC_LINK (base64 .p12 or path) + CSC_KEY_PASSWORD   -> Developer ID Application signing
#        APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
#          or APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER   -> notarisation (notarytool)
# Windows WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD (Authenticode .pfx)  -> installer signing
#
# `mac.identity` and `mac.notarize` are therefore deliberately NOT set: `identity: null`
# would switch signing off for everyone, including the release workflow that holds the
# credentials. The cost is that a developer with a Developer ID certificate in their login
# keychain signs a local `dist:mac` too — a signed build of this source is not a problem;
# claiming one that is not signed would be, and `CODE_SIGNED` in `src/main/build-info.ts`
# stays `false` in the repository (the release workflow stamps it only after credentials
# are present, and the build is then verified). The Homebrew cask and winget stay on their
# placeholders until a verified signed and notarised release has actually been published
# (packaging/README.md).
#
# NAMES. `productName` is the name a user sees: the `.app` bundle, CFBundleName, the menu-bar
# title, the Windows installer's title, its install directory and the Start menu entry. The
# artifact FILE names are a fixed slug instead, written out in `dmg.artifactName` and
# `nsis.artifactName` (and mirrored in `scripts/release-artifacts.mjs`): no spaces in a
# download URL, and the URLs `packaging/homebrew/devteam-app.rb` and the winget manifests
# point at stay what they were. The cask expects:
#   app "Dev Team Agents.app"        -> productName below
#   dev-team-agents-<version>.dmg    -> dmg.artifactName below
# and `appId` matches the bundle id the cask's `zap` block uses as its placeholder. `appId`
# is also what NSIS derives the install GUID from, so it must not change: an upgrade finds
# the previous install through it.
#
# Renaming is safe for stored state because nothing derives a path from `productName`:
# `userData` is pinned to `dev-team-agents-app` in `src/main/index.ts`.
appId: com.devtoolbelt.dev-team-agents-app
productName: Dev Team Agents
copyright: dev-team-agents contributors

directories:
  output: release
  buildResources: build

# Only the built output ships. `dependencies` in package.json is empty on purpose: the
# renderer is bundled by Vite and the main process imports nothing outside node's own
# library, so no `node_modules` tree is packaged.
files:
  - dist/**/*
  - package.json

# The tray / menu-bar icon, read by `src/main/background.ts` from
# `process.resourcesPath/tray/`. `build/` is buildResources and is not packaged, so the
# icon has to be carried explicitly — without this the tray would have no image in
# exactly the build it matters in.
extraResources:
  - from: build/tray
    to: tray

asar: true

# Electron fuses, flipped in the packaged binary. This app runs no Node CLI mode, takes no
# NODE_OPTIONS and needs no --inspect in production, so those attack surfaces are closed;
# app code loads only from the integrity-validated app.asar. The tray icon lives in
# extraResources (process.resourcesPath), outside the asar search path, so
# onlyLoadAppFromAsar does not affect it.
#
# grantFileProtocolExtraPrivileges stays on (Electron's default). The renderer is loaded
# over file:// and Vite emits `<script type="module" crossorigin>`; with the fuse off,
# file:// gets Chromium's plain behaviour, where a module script from the opaque file
# origin fails its CORS check and the window renders blank. What the fuse would have
# guarded — navigating to or fetching other file:// URLs — is already refused by
# `src/main/security.ts`, which confines file:// to the renderer's own directory.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true

# Stated rather than left to the default lookup. electron-builder would find
# `build/icon.icns` and `build/icon.png` on its own, but "the icon works because of a
# filename convention nobody wrote down" is how an unbranded installer ships: on Windows
# there is no `.ico` in the tree at all, and the `.ico` is *derived* from this 1024px PNG
# at build time. Both files come from `build/make-icon.sh`.
icon: build/icon.png

mac:
  # The icns beside it wins for macOS, which is what gives the .app its icon; the PNG
  # above is what every other target derives from.
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # MEASURED, not guessed: `node_modules/electron/dist/Electron.app` declares
  # LSMinimumSystemVersion 13.0, so Electron 44 does not run on Monterey. The cask in
  # packaging/ mirrors it as `depends_on macos: ">= :ventura"`; a lower cask floor would
  # install on a system the app cannot launch on. Re-measure on every Electron major; the
  # floor moves with it.
  minimumSystemVersion: '13.0'
  # One universal artifact, because the cask has one URL and ADR-0011's amendment describes
  # "a signed, notarised universal .dmg". Two per-arch dmgs would need two cask URLs and a
  # per-arch sha256, which the cask is not shaped for.
  target:
    - target: dmg
      arch:
        - universal
  # Signing and notarisation: environment-driven, see the header. `hardenedRuntime` and the
  # entitlements are electron-builder's defaults, which are what Electron needs to pass
  # notarisation; they have never been exercised against a real Apple account.
  extendInfo:
    # The app never loads remote content, so ATS exceptions are not needed and are not
    # added. Declared here so the absence is visibly deliberate.
    NSHighResolutionCapable: true
    # **Never override CFBundleName here.** Electron finds its `<name> Helper.app`s from the
    # bundle name, and electron-builder names them after `productName` — an override that
    # differs from `productName` makes the packaged app look for helpers that do not exist
    # and abort at launch ("Unable to find helper app"). No test catches it: none runs a
    # packaged build. The display name comes from `productName` alone.

dmg:
  # The fixed slug, not ${productName}: see NAMES in the header.
  artifactName: dev-team-agents-${version}.dmg

# WINDOWS SHAPE — DECIDED (M4.3 closeout); signing comes from the environment.
#
# Target: NSIS producing a single per-user installer .exe, one per architecture. Weighed
# against the other two electron-builder can produce:
#   - MSIX/AppX needs a trusted signing identity to install outside the Store at all — even
#     a self-signed cert requires the user to import it into their trusted root store by hand
#     before sideloading works. Unsigned MSIX is not "warned", it is refused. Off the table
#     with no Authenticode certificate (packaging/README.md § Prerequisites — winget app
#     manifest — records that none exists).
#   - MSI installs unsigned same as NSIS (a warning, not a refusal) but needs the WiX toolset
#     wired into the build and buys nothing here: no enterprise GPO deployment story is in
#     scope, and NSIS is what electron-builder documents as its default, best-supported target.
#   - NSIS is unsigned-friendly (SmartScreen warns, exactly like the unsigned macOS build's
#     Gatekeeper prompt — this app already ships that trade-off on one platform), needs no
#     external toolset, and its generated installer/uninstaller integrate with Add/Remove
#     Programs without any of this repository writing that logic.
#
# perMachine: false — a per-user install needs no admin elevation, which matters more for an
# UNSIGNED installer than a signed one: an elevated (per-machine) install of unsigned code is
# the more alarming UAC prompt, and per-user still lets `winget install --scope user` resolve
# the CLI dependency the same way `devteam-app.rb`'s `depends_on formula: "devteam"` does today.
# oneClick: false — shows the install-location wizard rather than silently placing files, so a
# user who sees the unsigned/SmartScreen warning also sees what they are agreeing to.
#
# Update/uninstall: NSIS's generated uninstaller is what Add/Remove Programs calls; nothing
# here implements auto-update (electron-updater is not wired — out of scope for this decision).
#
# Signing is environment-driven here too (header): WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD sign the
# installers; without them the build is unsigned and says so. A `.pfx` can only be exported
# from certificates issued before the 2023 CA/B Forum hardware-key rule — a certificate held
# on an HSM or in a cloud service (for example Azure Trusted Signing, which electron-builder
# supports through `win.azureSignOptions`) needs a different mechanism, not wired here.
# `forceCodeSigning: false` keeps a build with no credentials from failing.
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  # No certificateFile / certificatePassword in the file: they come from the environment.
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # The fixed slug, not ${productName}: see NAMES in the header. The installer's title, the
  # install directory, the shortcuts and the Add/Remove Programs entry all follow
  # `productName`.
  artifactName: dev-team-agents-Setup-${version}-${arch}.exe

afterAllArtifactBuild: build/after-build.cjs
