# electron-builder configuration.
#
# UNSIGNED BY DESIGN, FOR NOW. `mac.identity: null` disables code signing and
# `afterAllArtifactBuild` prints a banner saying so, because the alternative is a `.dmg`
# that looks shippable and is not. ADR-0011 requires macOS artifacts to be signed and
# notarised; its M4.1 amendment records that this is "blocked on signing credentials the
# repository owner holds". Wiring signing means an Apple Developer ID plus an
# app-specific password or API key for `notarytool`, and flipping `CODE_SIGNED` in
# `src/main/build-info.ts` — none of which can be done from this repository today.
#
# The artifact names are what `packaging/homebrew/devteam-app.rb` expects:
#   app "dev-team-agents.app"        -> productName: dev-team-agents
#   dev-team-agents-<version>.dmg    -> dmg.artifactName below
# and `appId` matches the bundle id the cask's `zap` block uses as its placeholder.
appId: com.devtoolbelt.dev-team-agents-app
productName: dev-team-agents
copyright: dev-team-agents contributors

directories:
  output: release
  buildResources: build

# Only the built output ships. `dependencies` in package.json is empty on purpose: the
# renderer is bundled by Vite and the main process imports nothing outside node's own
# library, so no `node_modules` tree is packaged.
files:
  - dist/**/*
  - package.json

asar: true

mac:
  category: public.app-category.developer-tools
  # MEASURED, not guessed: `node_modules/electron/dist/Electron.app` declares
  # LSMinimumSystemVersion 12.0, so Electron 39 does not run on Big Sur. The cask in
  # packaging/ says `depends_on macos: ">= :big_sur"` and its own comment asks for this to
  # be confirmed against the build — it is wrong and must become `">= :monterey"`, or the
  # cask will install on a system the app cannot launch on. Re-measure on every Electron
  # major; the floor moves with it.
  minimumSystemVersion: '12.0'
  # One universal artifact, because the cask has one URL and ADR-0011's amendment describes
  # "a signed, notarised universal .dmg". Two per-arch dmgs would need two cask URLs and a
  # per-arch sha256, which the cask is not shaped for.
  target:
    - target: dmg
      arch:
        - universal
  # Signing OFF. See the header.
  identity: null
  # `notarize` is a distinct step and is equally unavailable.
  notarize: false
  # No entitlements file: without signing, entitlements are inert, and shipping one would
  # suggest a hardened-runtime configuration that has never been exercised.
  extendInfo:
    # The app never loads remote content, so ATS exceptions are not needed and are not
    # added. Declared here so the absence is visibly deliberate.
    NSHighResolutionCapable: true

dmg:
  artifactName: ${productName}-${version}.dmg

# WINDOWS SHAPE — DECIDED (M4.3 closeout), UNSIGNED BY CONFIGURATION.
#
# Target: NSIS producing a single per-user installer .exe, one per architecture. Weighed
# against the other two electron-builder can produce:
#   - MSIX/AppX needs a trusted signing identity to install outside the Store at all — even
#     a self-signed cert requires the user to import it into their trusted root store by hand
#     before sideloading works. Unsigned MSIX is not "warned", it is refused. Off the table
#     with no Authenticode certificate (packaging/README.md § Prerequisites — winget app
#     manifest — records that none exists).
#   - MSI installs unsigned same as NSIS (a warning, not a refusal) but needs the WiX toolset
#     wired into the build and buys nothing here: no enterprise GPO deployment story is in
#     scope, and NSIS is what electron-builder documents as its default, best-supported target.
#   - NSIS is unsigned-friendly (SmartScreen warns, exactly like the unsigned macOS build's
#     Gatekeeper prompt — this app already ships that trade-off on one platform), needs no
#     external toolset, and its generated installer/uninstaller integrate with Add/Remove
#     Programs without any of this repository writing that logic.
#
# perMachine: false — a per-user install needs no admin elevation, which matters more for an
# UNSIGNED installer than a signed one: an elevated (per-machine) install of unsigned code is
# the more alarming UAC prompt, and per-user still lets `winget install --scope user` resolve
# the CLI dependency the same way `devteam-app.rb`'s `depends_on formula: "devteam"` does today.
# oneClick: false — shows the install-location wizard rather than silently placing files, so a
# user who sees the unsigned/SmartScreen warning also sees what they are agreeing to.
#
# Update/uninstall: NSIS's generated uninstaller is what Add/Remove Programs calls; nothing
# here implements auto-update (electron-updater is not wired — out of scope for this decision).
#
# Signing stays OFF, explicitly, the same way `mac.identity: null` does it above: no
# `win.certificateFile`/`certificatePassword` keys are set (there is no Authenticode
# certificate — see the mac block's header and packaging/README.md), and
# `forceCodeSigning: false` makes a future accidental signing attempt a no-op instead of a
# build failure if electron-builder ever finds credentials on a build machine's keychain by
# surprise.
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  # No certificateFile / certificatePassword — deliberately absent. See header above.
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.exe

afterAllArtifactBuild: build/after-build.cjs
